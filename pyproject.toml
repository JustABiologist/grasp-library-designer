[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-library-designer"
version = "0.1.0"
description = "Codon-optimize GRASP binder DNA for Golden Gate assembly (library + one-shot)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "biopython>=1.81",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "ipywidgets>=8.0",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
include = ["grasp_library*"]

[tool.setuptools.package-data]
grasp_library = ["py.typed"]
